name: CI

# Push-only: every branch push is verified and deployed (main to production, others to a preview).
# A pull_request trigger would re-run the same commit under a second ref without adding coverage.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-rust
      cancel-in-progress: true
    # rustup still finds rust-toolchain.toml at the root: it searches upwards from this directory.
    defaults:
      run:
        working-directory: wasm/market-sim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without arguments, rustup installs the toolchain, components and target that
      # rust-toolchain.toml pins.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: wasm/market-sim

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The bindings compile natively too, but the shipped module is wasm32.
      - name: Clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Per-job groups: a shared group would make sibling jobs of the same run cancel each other.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-web
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: wasm/market-sim
          # wasm-pack downloads the matching wasm-bindgen CLI and binaryen here.
          cache-directories: ~/.cache/.wasm-pack

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: wasm-pack@0.15.0

      - run: npm ci

      # The pre-hooks of later scripts rebuild it too; this step makes Wasm failures and timing
      # visible on their own.
      - name: Build the Wasm generator
        run: npm run wasm:build

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/realtime-market-dashboard
          retention-days: 7

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/realtime-market-dashboard/browser
          if-no-files-found: error
          retention-days: 7

  # Reported as its own check and deliberately not a deploy prerequisite: an advisory published
  # upstream must stay visible without freezing the live demo.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy
    needs: [rust, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploys queue instead of cancelling so a half-finished upload never races a newer one.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/realtime-market-dashboard/browser

      - name: Publish to Cloudflare
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          message="${GITHUB_SHA::7} ${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            npx wrangler deploy --message "$message"
            url="$(jq -r 'select(.type == "deploy") | .targets[0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          else
            # The alias becomes the DNS label "<alias>-realtime-market-dashboard" (max 63 chars), so it
            # gets 37 characters. Truncated names end in a hash of the full branch name, so two long
            # branches sharing a prefix never take over each other's preview URL.
            alias="b-$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REF_NAME" | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
            if (( ${#alias} > 37 )); then
              alias="$(cut -c1-32 <<< "$alias" | sed -E 's/-+$//')-$(sha256sum <<< "$GITHUB_REF_NAME" | cut -c1-4)"
            fi
            npx wrangler versions upload --preview-alias "$alias" --message "$message"
            url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url' "$WRANGLER_OUTPUT_FILE_PATH")"
          fi
          [[ "$url" == https://* ]] || { echo "::error::wrangler did not report a deployment URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`${GITHUB_SHA::7}\` to $url" >> "$GITHUB_STEP_SUMMARY"
