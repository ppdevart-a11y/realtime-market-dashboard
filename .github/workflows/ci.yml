name: CI

# Push-only: every branch push is verified and deployed (main to production, others to a preview).
# A pull_request trigger would re-run the same commit under a second ref without adding coverage.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds what gets deployed.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Per-job groups: a shared group would make sibling jobs of the same run cancel each other.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain

      - name: Build the Wasm generator
        run: npm run wasm:build

      - name: Build the application
        # The footer names the commit, so a redeploy can be confirmed at a glance.
        run: npm run build -- --define "BUILD_SHA='${GITHUB_SHA::7}'"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/realtime-market-dashboard/browser
          if-no-files-found: error
          retention-days: 7

  # Behaviour: type-checking and every test, TypeScript and Rust. A deploy waits for it.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain

      # The pre-hooks of later scripts rebuild it too; this step makes Wasm failures and timing
      # visible on their own.
      - name: Build the Wasm generator
        run: npm run wasm:build

      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Test the generator
        run: npm run test:rust -- --locked
      - name: Test the Cloudflare Worker
        run: npm run test:worker

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/realtime-market-dashboard
          retention-days: 7

  # Style and static analysis: Prettier, ESLint, Stylelint, rustfmt and Clippy (native and wasm32).
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain

      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:rust

  # Like lint, reported on its own and not a deploy prerequisite: an advisory published upstream
  # must stay visible without freezing the live demo.
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Deploys wait for the build and the tests, not for lint: a change pushed during a live demo must
  # not stay offline over formatting, while a behaviour regression should. Lint and audit still
  # report on the same commit.
  deploy:
    name: Deploy
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploys queue instead of cancelling so a half-finished upload never races a newer one.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.publish.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/realtime-market-dashboard/browser

      - name: Publish to Cloudflare
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          message="${GITHUB_SHA::7} ${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            npx wrangler deploy --message "$message"
            url="$(jq -r 'select(.type == "deploy") | .targets[0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          else
            # The alias becomes the DNS label "<alias>-realtime-market-dashboard" (max 63 chars), so it
            # gets 37 characters. Truncated names end in a hash of the full branch name, so two long
            # branches sharing a prefix never take over each other's preview URL.
            alias="b-$(tr '[:upper:]' '[:lower:]' <<< "$GITHUB_REF_NAME" | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
            if (( ${#alias} > 37 )); then
              alias="$(cut -c1-32 <<< "$alias" | sed -E 's/-+$//')-$(sha256sum <<< "$GITHUB_REF_NAME" | cut -c1-4)"
            fi
            npx wrangler versions upload --preview-alias "$alias" --message "$message"
            url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url' "$WRANGLER_OUTPUT_FILE_PATH")"
          fi
          [[ "$url" == https://* ]] || { echo "::error::wrangler did not report a deployment URL"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`${GITHUB_SHA::7}\` to $url" >> "$GITHUB_STEP_SUMMARY"
