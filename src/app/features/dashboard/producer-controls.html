<dl class="facts">
  <div>
    <dt>Run</dt>
    <dd>{{ store.runId() }}</dd>
  </div>
  <div>
    <dt>Instruments</dt>
    <dd>{{ store.settings().instrumentCount }}</dd>
  </div>
  <div>
    <dt>Nominal rate</dt>
    <dd>{{ nominalRate() | number }} updates/s</dd>
  </div>
  <div>
    <dt>Updates this run</dt>
    <dd>{{ store.totalUpdates() | number }}</dd>
  </div>
</dl>

<button type="button" class="button button-primary" (click)="act()">{{ actionLabel() }}</button>
